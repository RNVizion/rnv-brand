name: Profile drift

# Checks every repo in the ecosystem against profile.json, the machine source for
# identity facts. Surfaces drift independently and the drift is invisible from
# inside the surface that's wrong; this is the thing that notices without anyone
# remembering to look.
#
# It never edits. On drift it opens one issue and keeps it updated; when the drift
# clears it closes the issue itself. The issue list is the state: an open
# "Profile drift" issue means something disagrees, no issue means nothing does.
#
# THREE EXPRESSION BUGS TO NOT REINTRODUCE
# GitHub casts across types before comparing, so null and false both become 0.
#   1. A SKIPPED step's output is '', not '0'. Testing `!= '0'` treats "this step
#      didn't run" as failure, and the job fails on a clean push. Always test for
#      explicit failure: `== '1'`.
#   2. `inputs.x` is null outside workflow_dispatch, and `null != false` is FALSE,
#      so an opt-out phrased that way silently disables the step on every
#      scheduled run. Phrase opt-outs against `true` instead.
#   3. Rule 1 is correct for FAILING and wrong for CLOSING. `!= '1'` means "did not
#      explicitly fail", which is true of a step that never ran -- so a push with
#      clean surfaces closed the issue with a comment claiming the manifest agreed
#      with source, on an event where that check is skipped. The condition is kept
#      (a surface fix should still clear a surface issue) and the CLAIM is now
#      scoped to what actually ran. An idiom that is right in one direction is not
#      automatically right in its inverse.
on:
  # The schedule is load-bearing, not a convenience. Surface drift has a push
  # trigger; time-based checks do not -- an expiring surface goes stale with no
  # commit anywhere, so this run is the only thing that will ever notice.
  schedule:
    - cron: "0 13 * * 1"        # Mondays, 13:00 UTC
  push:
    branches: [main]
    paths:
      - "profile.json"           # change a fact, find out immediately what disagrees
      - "scripts/refresh_profile.py"
      - ".github/workflows/profile-drift.yml"
  workflow_dispatch:
    inputs:
      skip_facts:
        description: "Skip verifying the manifest against source (faster)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write                  # needed to open, update, and close the drift issue

concurrency:
  group: profile-drift
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # --all fetches every repo as a tarball
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib only, by design: no dependency can rot underneath the checker.
      - name: Check every surface
        id: surfaces
        run: |
          set +e
          python scripts/refresh_profile.py --all --quiet > report.txt 2>&1
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          cat report.txt
          exit 0

      # Verifies the manifest against reality rather than surfaces against the
      # manifest. Without it, a stale fact is enforced everywhere with total
      # confidence. Skipped on push so a one-line edit doesn't wait on fetches.
      - name: Verify facts against source
        id: facts
        if: github.event_name != 'push' && inputs.skip_facts != true
        run: |
          set +e
          python scripts/refresh_profile.py --verify-facts --quiet > facts.txt 2>&1
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          cat facts.txt
          exit 0

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-drift-report
          path: |
            report.txt
            facts.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Open or update the drift issue
        if: steps.surfaces.outputs.exit == '1' || steps.facts.outputs.exit == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The profile checker found surfaces that disagree with \`profile.json\`."
            echo
            echo "Run: [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo '### Surfaces'
            echo '```'
            cat report.txt
            echo '```'
            if [ -s facts.txt ]; then
              echo '### Manifest vs source'
              echo '```'
              cat facts.txt
              echo '```'
            fi
            echo
            echo "---"
            echo "Fix the surface, or if the fact itself changed, update \`profile.json\` first and push; that re-runs this check."
            echo
            echo "_Closes itself when the next run comes back clean._"
          } > body.md

          existing=$(gh issue list --state open --label profile-drift \
                       --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            echo "updated issue #$existing"
          else
            gh label create profile-drift --color d2bc93 \
              --description "profile.json and a surface disagree" 2>/dev/null || true
            gh issue create --title "Profile drift detected" \
                            --label profile-drift --body-file body.md
          fi

      # See bug 3 above. The condition is deliberately permissive so that fixing a
      # surface clears the issue on the push that fixes it; the closing comment is
      # what must not overclaim. FACTS_RAN is true only when the step actually ran
      # and passed -- a skipped step yields '' and so reports false, correctly.
      - name: Close the drift issue when clean
        if: steps.surfaces.outputs.exit == '0' && steps.facts.outputs.exit != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          FACTS_RAN: ${{ steps.facts.outputs.exit == '0' }}
        run: |
          if [ "$FACTS_RAN" = "true" ]; then
            scope="Every surface agrees with the manifest, and the manifest agrees with source."
          else
            scope="Every surface agrees with the manifest. The manifest-vs-source check did not run on this event, so nothing here speaks to it; the next scheduled run covers it."
          fi
          for n in $(gh issue list --state open --label profile-drift --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Clean as of run [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). $scope"
            echo "closed issue #$n"
          done

      - name: Fail the run on drift
        if: steps.surfaces.outputs.exit == '1' || steps.facts.outputs.exit == '1'
        run: |
          echo "Profile drift detected; see the open issue." >&2
          exit 1
