# Makes the register pip-installable. engine/brand.py is standard library
# only: no dependencies, pure data and pure functions.
#
# A consumer imports it as rnv_brand.brand (engine.brand also works; see
# compat/engine/brand.py) and pins a commit,
#
#     rnv-brand @ git+https://github.com/RNVizion/rnv-brand@<sha>
#
# and the pinned sha is a written statement of which revision that consumer
# reads -- visible in a diff when it changes, which a hand-kept copy of the
# values cannot give you.
#
# EVERY CONSUMER INSTALLS BY BUILDING THIS FILE, with whatever setuptools is
# current on the day it installs: the requirement below is a floor, and nothing
# a consumer pins reaches the build backend. A warning this build prints is
# therefore every consumer's problem at once, on a date, with no commit
# anywhere. Before landing a change here, build it and read the output:
#
#     python -m build --wheel . 2>&1 | grep -i warning      # must print nothing

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rnv-brand"
version = "49.0.0"          # major = the color register revision, so `pip show` answers "which rev?"
description = "The RNVizion brand register: the colors, the type and its font files, and the rules that derive them."
requires-python = ">=3.10"
dependencies = []           # deliberately none -- see the note above
# NO `license` KEY, AND THAT IS THE DECISION, NOT AN OMISSION -- README.md,
# "License". There is no LICENSE file in this repository and there has never
# been one. Do not point at one: until 2026-10-02 this line read
# `license = { file = "LICENSE" }`, which named a file that did not exist and
# used a table form setuptools has dated ("By 2027-Feb-18 ... or your builds
# will no longer be supported"). The built metadata carried no License field
# then and carries none now.

[project.urls]
Homepage = "https://github.com/RNVizion/rnv-brand"

[tool.setuptools]
# THE REGISTER INSTALLS AS `rnv_brand`, FROM THE engine/ FOLDER. Ruled by Chris,
# 2026-11-01. `engine` is a generic top-level name, and a consumer with its own
# `engine` package shadows ours: rnv-color-mcp has one, and from its folder
# `import engine.brand` failed with ModuleNotFoundError. The source stays at
# engine/brand.py because the checker, rnv-live's deploy and rnv-color-mcp's
# currency check all read that path; only the installed name moved.
#
# `engine` is still installed, from compat/engine/, so the eight consumers that
# import engine.brand keep working. Its brand module IS rnv_brand.brand, not a
# copy. Each consumer moves its import when it next moves its pin, and then
# `engine` is removed: README.md, "Importing it".
#
# rnv_brand.fonts holds no Python. It is listed because Python treats any folder
# inside a package as importable, and setuptools warns, which the build watch
# turns red, when such a folder ships without being named here. Measured
# 2026-10-18 on setuptools 84.0.0: one warning with it absent, none with it here.
packages = ["rnv_brand", "rnv_brand.fonts", "engine"]
package-dir = { "rnv_brand" = "engine", "engine" = "compat/engine" }

[tool.setuptools.package-data]
# py.typed marks the package as typed. The registers (BRAND_COLORS.md,
# BRAND_TYPE.md) are NOT in the wheel: a consumer reads values from `engine`
# and reads the reasoning in this repository, at the commit it pins.
#
# THE FONT FILES ARE, with each family's license beside them, because a
# consumer serves them from where the wheel installed them: fonts_dir().
# The SIL Open Font License travels with the fonts by its own terms, and it is
# the fonts' license, not this repository's. Added 2026-10-18, minor version 1:
# the colors did not move, so the major did not.
rnv_brand = ["py.typed"]
"rnv_brand.fonts" = ["*.woff2", "OFL-*.txt"]
